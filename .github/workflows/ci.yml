# Checks of every push and pull request: grammar, compiler, WebAssembly module, VS Code extension,
# IntelliJ plugin.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grammar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grammar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: grammar/package-lock.json
      - run: npm ci
      - name: Generated parser up to date with grammar.js
        run: |
          npx tree-sitter generate
          git diff --exit-code -- src
      - run: npx tree-sitter test

  compiler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4
      # The toolchain, its components and targets come from compiler/rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Examples valid and formatted
        run: |
          for example in ../examples/*/; do
            cargo run -q -p cadastre -- check "$example"
            cargo run -q -p cadastre -- fmt "$example" --check
          done

  wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler
    env:
      CC_wasm32_unknown_unknown: clang
      AR_wasm32_unknown_unknown: llvm-ar
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: wasm
      - run: cargo build -p cadastre-wasm --target wasm32-unknown-unknown --profile wasm
      - name: Size of the module
        run: ls -l target/wasm32-unknown-unknown/wasm/cadastre_wasm.wasm
      - name: Self-hosted playground
        run: python3 web/build-playground.py --wasm compiler/target/wasm32-unknown-unknown/wasm/cadastre_wasm.wasm --out playground
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: cadastre-wasm
          path: compiler/target/wasm32-unknown-unknown/wasm/cadastre_wasm.wasm

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm test

  intellij:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/intellij
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew buildPlugin
      # The plugin of the commit, to try it or to upload it by hand.
      - uses: actions/upload-artifact@v4
        with:
          name: cadastre-intellij
          path: editors/intellij/build/distributions/*.zip
