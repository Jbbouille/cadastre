[workspace]
resolver = "2"
members = ["crates/cadastre-core", "crates/cadastre-project", "crates/cadastre-mcp", "crates/cadastre-cli", "crates/cadastre-lsp", "crates/cadastre-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jbbouille/cadastre"
homepage = "https://cadastre-lang.org/"

[workspace.dependencies]
# The crates of the workspace, at the version of the workspace: published together (crates.io).
cadastre-core = { path = "crates/cadastre-core", version = "0.1.0" }
cadastre-project = { path = "crates/cadastre-project", version = "0.1.0" }
cadastre-lsp = { path = "crates/cadastre-lsp", version = "0.1.0" }
cadastre-mcp = { path = "crates/cadastre-mcp", version = "0.1.0" }
# Without `std`: no regular expressions for query predicates, which our queries do not use
# (a third smaller WebAssembly module).
tree-sitter = { version = "0.27", default-features = false }

[profile.dev]
# Debug information reduced to line tables (backtraces keep their lines): a far smaller target/debug.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
# Small binaries, in particular the WebAssembly module loaded by browsers.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The WebAssembly module: smaller still, at the expense of speed (`cargo build --profile wasm`).
[profile.wasm]
inherits = "release"
opt-level = "z"
