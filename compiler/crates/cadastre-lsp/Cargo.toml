[package]
name = "cadastre-lsp"
description = "Language server for Cadastre: diagnostics and semantic highlighting in editors."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cadastre-core = { path = "../cadastre-core" }
cadastre-project = { path = "../cadastre-project" }
lsp-server = "0.7"
lsp-types = "0.95"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
