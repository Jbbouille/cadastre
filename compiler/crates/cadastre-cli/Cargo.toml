[package]
name = "cadastre"
description = "Your IT landscape, as code: the `cadastre` command, which compiles a project describing an information system, draws its views and runs its checks."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../../README.md"
keywords = ["architecture", "diagrams", "infrastructure", "cartography", "as-code"]
categories = ["command-line-utilities", "visualization", "development-tools"]

[[bin]]
name = "cadastre"
path = "src/main.rs"

[dependencies]
cadastre-core.workspace = true
cadastre-project.workspace = true
cadastre-lsp.workspace = true
cadastre-mcp.workspace = true
serde_json = "1"

[features]
# Prototype: `render elk`, the layout of Eclipse ELK ported to Rust (EPL-2.0).
elk = ["cadastre-core/elk"]
