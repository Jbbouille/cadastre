[package]
name = "cadastre-wasm"
description = "Cadastre in the browser: the compiler core exposed as WebAssembly."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cadastre-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
